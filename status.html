<header class="page-hero wrap">
  <p class="eyebrow">Already registered</p>
  <h1>Find your place</h1>
  <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
  <p>Use the registration code and the email from the form. From here you can pay and open the pass.</p>
</header>
<section class="wrap section">
  <form id="lookup-form" class="form-grid panel">
    <label>Registration code <input id="lookup-code" autocomplete="off" required></label>
    <label>Email <input id="lookup-email" type="email" autocomplete="email" required></label>
    <button class="btn btn-primary" type="submit">Show my registration</button>
    <p id="lookup-error" class="alert" hidden></p>
  </form>
  <div id="status-root"></div>
</section>
